version: '3.8'

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - proxy

  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-le
    depends_on:
      - nginx-proxy
    environment:
      - DEFAULT_EMAIL=raviv@mailbux.com
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/etc/acme.sh

    restart: unless-stopped
    networks:
      - proxy

  mailbux-web:
    build: .
    container_name: mailbux-web
    environment:
      - VIRTUAL_HOST=beta.mailbux.com
      - LETSENCRYPT_HOST=beta.mailbux.com
      - LETSENCRYPT_EMAIL=raviv@mailbux.com
    volumes:
      - ./env.file:/app/.env:ro
      - ./build/web:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      - nginx-proxy
      - letsencrypt

volumes:
  certs:
  vhost:
  html:
  acme:

networks:
  proxy:
    external: false 